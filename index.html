    <script>
        gsap.to(".app-container", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" });

        // =========================================================================
        // 1. NAVEGAÇÃO ENTRE AS 3 TELAS PRINCIPAIS (HOME, LEITURA, LIVROS)
        // =========================================================================
        const viewHome = document.getElementById('view-home');
        const viewReader = document.getElementById('view-reader');
        const viewBooks = document.getElementById('view-books');
        const btnHome = document.getElementById('btn-home');
        let currentView = 'home';

        function navigateTo(viewName) {
            if (isListening && viewName !== 'reader') {
                isListening = false;
                try { recognition.stop(); } catch(e) {}
            }
            if (isCapturingMultiWords && multiWordRecognition) {
                isCapturingMultiWords = false;
                try { multiWordRecognition.stop(); } catch(e) {}
            }
            stopStudioMicStream();

            currentView = viewName;
            viewHome.classList.add('hidden');
            viewReader.classList.add('hidden');
            viewReader.classList.remove('flex');
            viewBooks.classList.add('hidden');
            viewBooks.classList.remove('flex');

            if (viewName === 'home') {
                viewHome.classList.remove('hidden');
                btnHome.classList.add('invisible');
                updateHomeSummary();
            } else if (viewName === 'reader') {
                viewReader.classList.remove('hidden');
                viewReader.classList.add('flex');
                btnHome.classList.remove('invisible');
                updateActiveBookHeader();
                updateModeButtonsUI();
            } else if (viewName === 'books') {
                viewBooks.classList.remove('hidden');
                viewBooks.classList.add('flex');
                btnHome.classList.remove('invisible');
                renderBookManagerUI();
                renderCustomSoundsUI();
            }
        }

        btnHome.addEventListener('click', () => navigateTo('home'));

        document.getElementById('btn-home-read-any').addEventListener('click', () => {
            navigateTo('reader');
        });

        document.getElementById('btn-home-register-book').addEventListener('click', () => {
            navigateTo('books');
        });

        document.getElementById('btn-reader-pick-book').addEventListener('click', () => {
            navigateTo('books');
        });

        // =========================================================================
        // 2. DARK MODE & WAKE LOCK
        // =========================================================================
        document.getElementById('btn-theme').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            document.body.classList.toggle('bg-dark-mode');
            document.body.classList.toggle('bg-light-mode');
        });

        let wakeLock = null;
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
        }

        // =========================================================================
        // 3. REPRODUTOR DE ÁUDIO DESTRAVADO PARA MOBILE
        // =========================================================================
        const globalAudio = new Audio();
        globalAudio.playsInline = true;
        let audioCtx = null;

        function unlockMobileAudio() {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
                if (!audioCtx) audioCtx = new AudioContextClass();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }
            if (navigator.audioSession) {
                try { navigator.audioSession.type = 'play-and-record'; } catch(e) {}
            }
            globalAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            globalAudio.volume = 1.0;
            globalAudio.play().catch(() => {});
        }

        // =========================================================================
        // 4. DADOS: SONS DO APP, SONS GLOBAIS E LIVROS CADASTRADOS
        // =========================================================================
        const baseLibrary = {
            'leão': { audioSrc: './audios/Leão.WAV', emoji: '🦁' },
            'leao': { audioSrc: './audios/Leão.WAV', emoji: '🦁' },
            'macaco': { audioSrc: './audios/macaco.mp3', emoji: '🐵' },
            'cabra': { audioSrc: './audios/cabra.wav', emoji: '🐐' },
            'bode': { audioSrc: './audios/cabra.wav', emoji: '🐐' },
            'galinha': { audioSrc: './audios/galinha.wav', emoji: '🐔' },
            'gato': { audioSrc: './audios/gato.wav', emoji: '🐱' },
            'pato': { audioSrc: './audios/pato.wav', emoji: '🦆' },
            'galo': { audioSrc: './audios/rooster-crow.wav', emoji: '🐓' },
            'planta': { audioSrc: './audios/crop-wither.wav', emoji: '🌿' },
            'mato': { audioSrc: './audios/weed-pull.wav', emoji: '🌱' },
            'quebrou': { audioSrc: './audios/tool-break.wav', emoji: '💥' },
            'cachorro': { audioSrc: './audios/cachorro.mp3', emoji: '🐶' },
            'cavalo': { audioSrc: './audios/cavalo.mp3', emoji: '🐴' },
            'passarinho': { audioSrc: './audios/passarinho.mp3', emoji: '🐦' },
            'chuva': { audioSrc: './audios/chuva.mp3', emoji: '🌧️' },
            'vento': { audioSrc: './audios/vento.mp3', emoji: '💨' },
            'trovão': { audioSrc: './audios/trovao.mp3', emoji: '⚡' },
            'trovao': { audioSrc: './audios/trovao.mp3', emoji: '⚡' },
            'água': { audioSrc: './audios/agua.mp3', emoji: '💧' },
            'agua': { audioSrc: './audios/agua.mp3', emoji: '💧' },
            'fogo': { audioSrc: './audios/fogo.mp3', emoji: '🔥' },
            'risada': { audioSrc: './audios/risada.mp3', emoji: '😂' },
            'choro': { audioSrc: './audios/choro.mp3', emoji: '😭' },
            'magia': { audioSrc: './audios/magia.mp3', emoji: '🪄' },
            'pulo': { audioSrc: './audios/pulo.mp3', emoji: '🦘' },
            'carro': { audioSrc: './audios/carro.mp3', emoji: '🚗' },
            'buzina': { audioSrc: './audios/buzina.mp3', emoji: '📯' },
            'avião': { audioSrc: './audios/aviao.mp3', emoji: '✈️' },
            'aviao': { audioSrc: './audios/aviao.mp3', emoji: '✈️' }
        };

        let globalCustomSounds = JSON.parse(localStorage.getItem('livroMagicoCustomWords')) || {};
        let booksLibrary = JSON.parse(localStorage.getItem('livroMagicoBooks')) || {};
        let activeBookId = localStorage.getItem('livroMagicoActiveBookId') || '';
        if (activeBookId && !booksLibrary[activeBookId]) activeBookId = '';

        let freeReadingTranscript = localStorage.getItem('livroMagicoFreeTranscript') || '';
        let soundMode = getTotalRecordedSoundsCount() > 0 ? 'custom' : 'app';
        let useAppFallback = true;

        function saveAllStorage() {
            localStorage.setItem('livroMagicoCustomWords', JSON.stringify(globalCustomSounds));
            localStorage.setItem('livroMagicoBooks', JSON.stringify(booksLibrary));
            localStorage.setItem('livroMagicoActiveBookId', activeBookId);
            localStorage.setItem('livroMagicoFreeTranscript', freeReadingTranscript);
            updateHomeSummary();
        }

        function getTotalRecordedSoundsCount() {
            let count = Object.keys(globalCustomSounds).length;
            Object.values(booksLibrary).forEach(b => {
                if (b.sounds) count += Object.keys(b.sounds).length;
            });
            return count;
        }

        function updateHomeSummary() {
            const bookCount = Object.keys(booksLibrary).length;
            const soundCount = getTotalRecordedSoundsCount();
            const el = document.getElementById('home-books-summary');
            if (bookCount === 0 && soundCount === 0) {
                el.innerText = 'Criar histórias e gravar sons próprios';
            } else {
                el.innerText = `${bookCount} livro(s) • ${soundCount} som(ns) gravado(s)`;
            }
        }

        // =========================================================================
        // HIERARQUIA DE SONS: 1º Livro Específico -> 2º Global -> 3º Sons do App
        // =========================================================================
        function resolveSoundWithHierarchy(word) {
            if (soundMode === 'app') {
                return baseLibrary[word] ? { ...baseLibrary[word], origin: 'Som do app' } : null;
            }
            if (activeBookId && booksLibrary[activeBookId]?.sounds?.[word]) {
                return { ...booksLibrary[activeBookId].sounds[word], origin: booksLibrary[activeBookId].title };
            }
            if (globalCustomSounds[word]) {
                return { ...globalCustomSounds[word], origin: 'Som global' };
            }
            if (useAppFallback && baseLibrary[word]) {
                return { ...baseLibrary[word], origin: 'Som do app' };
            }
            return null;
        }

        // =========================================================================
        // 5. DOWNLOAD DE LEMBRANÇAS (.ZIP / INDIVIDUAL)
        // =========================================================================
        function getExtensionFromDataUrl(dataUrl) {
            if (!dataUrl || !dataUrl.startsWith('data:')) return 'webm';
            const mime = dataUrl.substring(5, dataUrl.indexOf(';'));
            if (mime.includes('mp4') || mime.includes('aac') || mime.includes('m4a')) return 'm4a';
            if (mime.includes('mpeg') || mime.includes('mp3')) return 'mp3';
            if (mime.includes('wav')) return 'wav';
            return 'webm';
        }

        window.downloadSingleSound = function(word, scopeKey) {
            let item = scopeKey === 'GLOBAL' ? globalCustomSounds[word] : booksLibrary[scopeKey]?.sounds?.[word];
            let prefix = scopeKey === 'GLOBAL' ? 'Todos_os_Livros' : (booksLibrary[scopeKey]?.title || 'Livro').replace(/[^a-zA-Z0-9À-ÿ]/g, '_');
            if (!item || !item.audioSrc) return;

            const ext = getExtensionFromDataUrl(item.audioSrc);
            const a = document.createElement('a');
            a.href = item.audioSrc;
            a.download = `Lembranca_${prefix}_${word}.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        async function downloadAllRecordedSoundsAsKeepsake() {
            if (getTotalRecordedSoundsCount() === 0) return;
            if (typeof JSZip === 'undefined') {
                Object.keys(globalCustomSounds).forEach(w => window.downloadSingleSound(w, 'GLOBAL'));
                Object.keys(booksLibrary).forEach(bId => Object.keys(booksLibrary[bId].sounds || {}).forEach(w => window.downloadSingleSound(w, bId)));
                return;
            }
            const zip = new JSZip();
            Object.keys(globalCustomSounds).forEach(word => {
                const item = globalCustomSounds[word];
                if (item.audioSrc?.includes(',')) {
                    zip.file(`Todos_os_Livros/${word}.${getExtensionFromDataUrl(item.audioSrc)}`, item.audioSrc.split(',')[1], { base64: true });
                }
            });
            Object.values(booksLibrary).forEach(book => {
                const folderName = book.title.replace(/[^a-zA-Z0-9À-ÿ _-]/g, '').trim() || 'Livro';
                Object.keys(book.sounds || {}).forEach(word => {
                    const item = book.sounds[word];
                    if (item.audioSrc?.includes(',')) {
                        zip.file(`Livro_${folderName}/${word}.${getExtensionFromDataUrl(item.audioSrc)}`, item.audioSrc.split(',')[1], { base64: true });
                    }
                });
            });
            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Lembrancas_Sons_Livro_Magico.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 3000);
        }

        document.getElementById('btn-download-all-sounds').addEventListener('click', downloadAllRecordedSoundsAsKeepsake);

        // =========================================================================
        // 6. ALTERNADOR DE MODO DE SOM & RENDERIZAÇÃO DE CHIPS
        // =========================================================================
        const btnModeApp = document.getElementById('btn-mode-app');
        const btnModeCustom = document.getElementById('btn-mode-custom');
        const fallbackModal = document.getElementById('fallback-modal');

        function updateModeButtonsUI() {
            const activeCls = ['bg-purple-600', 'text-white', 'shadow-sm'];
            const inactiveCls = ['text-gray-600', 'dark:text-gray-300'];

            if (soundMode === 'app') {
                btnModeApp.classList.add(...activeCls);
                btnModeApp.classList.remove(...inactiveCls);
                btnModeCustom.classList.remove(...activeCls);
                btnModeCustom.classList.add(...inactiveCls);
            } else {
                btnModeCustom.classList.add(...activeCls);
                btnModeCustom.classList.remove(...inactiveCls);
                btnModeApp.classList.remove(...activeCls);
                btnModeApp.classList.add(...inactiveCls);
            }
            renderCustomSoundsUI();
        }

        btnModeApp.addEventListener('click', () => {
            soundMode = 'app';
            updateModeButtonsUI();
            showAudioFeedback('🎵 Usando sons do app');
        });

        btnModeCustom.addEventListener('click', () => {
            if (getTotalRecordedSoundsCount() === 0) {
                openStudioForWord('');
                return;
            }
            fallbackModal.classList.remove('hidden');
            fallbackModal.classList.add('flex');
        });

        document.getElementById('btn-fallback-yes').addEventListener('click', () => {
            soundMode = 'custom';
            useAppFallback = true;
            fallbackModal.classList.add('hidden');
            fallbackModal.classList.remove('flex');
            updateModeButtonsUI();
            showAudioFeedback('🎧 Meus sons + sons do app');
        });

        document.getElementById('btn-fallback-no').addEventListener('click', () => {
            soundMode = 'custom';
            useAppFallback = false;
            fallbackModal.classList.add('hidden');
            fallbackModal.classList.remove('flex');
            updateModeButtonsUI();
            showAudioFeedback('🎧 Apenas meus sons');
        });

        window.moveBookSoundToGlobal = function(bookId, word) {
            const book = booksLibrary[bookId];
            if (!book?.sounds?.[word]) return;
            if (globalCustomSounds[word] && !confirm(`Sobrescrever o som global existente de "${word}"?`)) return;
            globalCustomSounds[word] = { ...book.sounds[word] };
            saveAllStorage();
            renderCustomSoundsUI();
            renderBookManagerUI();
            showAudioFeedback(`🌍 "${word}" disponível em todos os livros!`);
        };

        window.deleteCustomSound = function(word, scopeKey) {
            if (scopeKey === 'GLOBAL') delete globalCustomSounds[word];
            else if (booksLibrary[scopeKey]?.sounds) delete booksLibrary[scopeKey].sounds[word];
            saveAllStorage();
            renderCustomSoundsUI();
            renderBookManagerUI();
        };

        function renderCustomSoundsUI() {
            const listEl = document.getElementById('custom-sounds-list');
            const badgeEl = document.getElementById('custom-count-badge');
            const clearBtn = document.getElementById('btn-clear-custom');
            const downloadAllBtn = document.getElementById('btn-download-all-sounds');
            const quickBar = document.getElementById('quick-test-bar');

            const totalRecorded = getTotalRecordedSoundsCount();
            if (totalRecorded > 0) {
                badgeEl.innerText = totalRecorded;
                badgeEl.classList.remove('hidden');
                clearBtn.classList.remove('hidden');
                downloadAllBtn.classList.remove('hidden');
            } else {
                badgeEl.classList.add('hidden');
                clearBtn.classList.add('hidden');
                downloadAllBtn.classList.add('hidden');
            }

            listEl.innerHTML = '';
            if (totalRecorded === 0) {
                listEl.innerHTML = '<span class="text-xs text-gray-400 italic mx-auto">Nenhum som gravado ainda.</span>';
            } else {
                Object.values(booksLibrary).forEach(book => {
                    Object.keys(book.sounds || {}).forEach(word => {
                        const item = book.sounds[word];
                        const chip = document.createElement('div');
                        chip.className = 'flex items-center gap-1 bg-purple-50 dark:bg-slate-900 border border-purple-300 dark:border-purple-700 px-2.5 py-1 rounded-full text-xs font-bold text-purple-900 dark:text-purple-200';
                        chip.innerHTML = `
                            <button type="button" onclick="playSpecificSound('${book.id}', '${word}')" class="flex items-center gap-1">
                                <span>▶️</span><span>${item.emoji}</span><span>${word}</span>
                                <span class="text-[9px] bg-purple-200 dark:bg-purple-800 px-1.5 rounded-full">📚 ${book.title}</span>
                            </button>
                            <button type="button" onclick="moveBookSoundToGlobal('${book.id}', '${word}')" class="text-[10px] px-1" title="Usar em todos os livros">🌍</button>
                            <button type="button" onclick="downloadSingleSound('${word}', '${book.id}')" class="text-xs" title="Baixar">⬇️</button>
                            <button type="button" onclick="deleteCustomSound('${word}', '${book.id}')" class="text-gray-400 hover:text-red-500 font-extrabold ml-0.5">×</button>
                        `;
                        listEl.appendChild(chip);
                    });
                });

                Object.keys(globalCustomSounds).forEach(word => {
                    const item = globalCustomSounds[word];
                    const chip = document.createElement('div');
                    chip.className = 'flex items-center gap-1 bg-white dark:bg-slate-900 border border-indigo-200 dark:border-slate-600 px-2.5 py-1 rounded-full text-xs font-bold text-gray-700 dark:text-gray-200';
                    chip.innerHTML = `
                        <button type="button" onclick="playSpecificSound('GLOBAL', '${word}')" class="flex items-center gap-1">
                            <span>▶️</span><span>${item.emoji}</span><span>${word}</span>
                            <span class="text-[9px] bg-indigo-100 dark:bg-slate-700 px-1.5 rounded-full">🌍 Global</span>
                        </button>
                        <button type="button" onclick="downloadSingleSound('${word}', 'GLOBAL')" class="text-xs" title="Baixar">⬇️</button>
                        <button type="button" onclick="deleteCustomSound('${word}', 'GLOBAL')" class="text-gray-400 hover:text-red-500 font-extrabold ml-0.5">×</button>
                    `;
                    listEl.appendChild(chip);
                });
            }

            // Botões de teste rápido na tela de leitura
            let quickHTML = '';
            const shownWords = new Set();

            if (soundMode === 'custom') {
                if (activeBookId && booksLibrary[activeBookId]?.sounds) {
                    Object.keys(booksLibrary[activeBookId].sounds).forEach(w => {
                        const item = booksLibrary[activeBookId].sounds[w];
                        shownWords.add(w);
                        quickHTML += `<button type="button" onclick="triggerEffect('${w}')" class="px-3 py-1 rounded-full bg-purple-600 text-white font-bold shadow-sm">${item.emoji} ${w}</button>`;
                    });
                }
                Object.keys(globalCustomSounds).forEach(w => {
                    if (!shownWords.has(w)) {
                        const item = globalCustomSounds[w];
                        shownWords.add(w);
                        quickHTML += `<button type="button" onclick="triggerEffect('${w}')" class="px-3 py-1 rounded-full bg-purple-100 dark:bg-purple-900/60 border border-purple-300 text-purple-800 dark:text-purple-200 font-bold">${item.emoji} ${w}</button>`;
                    }
                });
            }

            if (soundMode === 'app' || useAppFallback) {
                [
                    { w: 'leão', e: '🦁', label: 'Leão' },
                    { w: 'macaco', e: '🐵', label: 'Macaco' },
                    { w: 'gato', e: '🐱', label: 'Gato' },
                    { w: 'chuva', e: '🌧️', label: 'Chuva' },
                    { w: 'magia', e: '🪄', label: 'Magia' }
                ].forEach(s => {
                    if (!shownWords.has(s.w)) {
                        quickHTML += `<button type="button" onclick="triggerEffect('${s.w}')" class="px-3 py-1 rounded-full bg-white/75 dark:bg-slate-800/75 hover:bg-purple-100 text-gray-700 dark:text-gray-200 font-semibold shadow-sm">${s.e} ${s.label}</button>`;
                    }
                });
            }
            quickBar.innerHTML = quickHTML;
        }

        window.playSpecificSound = function(scopeKey, word) {
            unlockMobileAudio();
            if (scopeKey === 'GLOBAL' && globalCustomSounds[word]) playSoundAndAnimate(word, globalCustomSounds[word]);
            else if (booksLibrary[scopeKey]?.sounds?.[word]) playSoundAndAnimate(word, booksLibrary[scopeKey].sounds[word]);
        };

        document.getElementById('btn-clear-custom').addEventListener('click', () => {
            if (confirm('Apagar todos os sons gravados?')) {
                globalCustomSounds = {};
                Object.values(booksLibrary).forEach(b => { b.sounds = {}; });
                saveAllStorage();
                renderCustomSoundsUI();
                renderBookManagerUI();
            }
        });

        // =========================================================================
        // 7. GERENCIAMENTO DE LIVROS E DITAR VÁRIAS PALAVRAS
        // =========================================================================
        const bookTitleInput = document.getElementById('book-title-input');
        let multiWordRecognition = null;
        let isCapturingMultiWords = false;
        let inlineRecordingWord = null;

        function updateActiveBookHeader() {
            const titleEl = document.getElementById('reader-book-title');
            if (activeBookId && booksLibrary[activeBookId]) {
                const b = booksLibrary[activeBookId];
                titleEl.innerText = b.title;
                fullReadingTranscript = b.transcript || '';
            } else {
                titleEl.innerText = 'Leitura Livre (Qualquer Livro)';
                fullReadingTranscript = freeReadingTranscript;
            }
            document.getElementById('final-text').innerText = fullReadingTranscript;
            document.getElementById('interim-text').innerText = '';
            if (fullReadingTranscript.trim().length > 0) {
                generateWordCloud();
            } else {
                document.getElementById('wordcloud-section').classList.add('hidden');
            }
            renderCustomSoundsUI();
        }

        window.selectBook = function(bookId) {
            activeBookId = bookId;
            saveAllStorage();
            if (bookId && booksLibrary[bookId]) {
                bookTitleInput.value = booksLibrary[bookId].title;
                if (Object.keys(booksLibrary[bookId].sounds || {}).length > 0) {
                    soundMode = 'custom';
                }
            } else {
                bookTitleInput.value = '';
            }
            updateActiveBookHeader();
            updateModeButtonsUI();
            renderBookManagerUI();
        };

        function createOrUpdateBookFromInput() {
            const title = bookTitleInput.value.trim();
            if (!title) {
                alert('Digite o nome do livro primeiro!');
                return null;
            }
            let existingId = Object.keys(booksLibrary).find(id => booksLibrary[id].title.toLowerCase() === title.toLowerCase());
            if (!existingId) {
                existingId = 'book_' + Date.now();
                booksLibrary[existingId] = { id: existingId, title, transcript: '', plannedWords: [], sounds: {} };
            } else {
                booksLibrary[existingId].title = title;
            }
            window.selectBook(existingId);
            return existingId;
        }

        document.getElementById('btn-save-book-title').addEventListener('click', () => {
            const id = createOrUpdateBookFromInput();
            if (id) document.getElementById('book-multiword-feedback').innerText = `✅ Livro "${booksLibrary[id].title}" salvo!`;
        });

        function renderBookManagerUI() {
            const savedList = document.getElementById('saved-books-list');
            const wordsList = document.getElementById('book-words-list');
            const bookIds = Object.keys(booksLibrary);

            savedList.innerHTML = '';
            // Chip para Leitura Livre
            const freeChip = document.createElement('button');
            freeChip.type = 'button';
            freeChip.onclick = () => window.selectBook('');
            freeChip.className = `px-3 py-1.5 rounded-xl text-xs font-extrabold border transition-all ${!activeBookId ? 'bg-purple-600 text-white border-purple-600 shadow-sm' : 'bg-white dark:bg-slate-900 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-slate-700'}`;
            freeChip.innerText = '✨ Leitura Livre';
            savedList.appendChild(freeChip);

            bookIds.forEach(id => {
                const b = booksLibrary[id];
                const isSelected = id === activeBookId;
                const soundCount = Object.keys(b.sounds || {}).length;
                const btn = document.createElement('div');
                btn.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer border transition-all ${isSelected ? 'bg-purple-600 text-white border-purple-600 shadow-sm' : 'bg-white dark:bg-slate-900 text-gray-700 dark:text-gray-200 border-purple-200 dark:border-slate-700'}`;
                btn.innerHTML = `
                    <span onclick="selectBook('${id}')">📘 ${b.title} (${soundCount})</span>
                    <button type="button" onclick="deleteBook('${id}')" class="ml-1 opacity-70 hover:opacity-100">×</button>
                `;
                savedList.appendChild(btn);
            });

            if (!activeBookId || !booksLibrary[activeBookId]) {
                bookTitleInput.value = '';
                wordsList.innerHTML = '<span class="text-xs text-gray-400 italic block text-center py-4">Digite o nome de um novo livro acima ou escolha um já salvo.</span>';
                return;
            }

            const currentBook = booksLibrary[activeBookId];
            bookTitleInput.value = currentBook.title;
            const allBookWords = new Set([...(currentBook.plannedWords || []), ...Object.keys(currentBook.sounds || {})]);

            if (allBookWords.size === 0) {
                wordsList.innerHTML = '<span class="text-xs text-gray-400 italic block text-center py-4">Toque em "🗣️ Ditar Palavras" para adicionar os gatilhos deste livro.</span>';
            } else {
                wordsList.innerHTML = '';
                allBookWords.forEach(word => {
                    const soundObj = currentBook.sounds?.[word];
                    const hasSound = Boolean(soundObj);
                    const isRecordingThis = inlineRecordingWord === word;

                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between gap-2 p-2.5 rounded-2xl bg-white dark:bg-slate-800 border border-purple-100 dark:border-slate-700';
                    row.innerHTML = `
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="text-lg">${hasSound ? soundObj.emoji : '🔊'}</span>
                            <span class="font-extrabold text-sm text-gray-800 dark:text-white truncate">${word}</span>
                            ${hasSound ? '<span class="text-[10px] bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 px-2 py-0.5 rounded-full font-bold">Pronto</span>' : ''}
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button type="button" onclick="recordForBookWord('${word}')" title="Gravar som (4s)" class="w-9 h-9 rounded-full bg-white border-2 border-red-500 flex items-center justify-center shadow ${isRecordingThis ? 'rec-active' : ''}">
                                <span class="w-3.5 h-3.5 ${isRecordingThis ? 'rounded-sm scale-75' : 'rounded-full'} bg-red-500 block"></span>
                            </button>
                            ${hasSound ? `
                                <button type="button" onclick="playSpecificSound('${currentBook.id}', '${word}')" class="p-1.5 rounded-xl bg-purple-100 dark:bg-slate-700 text-xs">▶️</button>
                                <button type="button" onclick="moveBookSoundToGlobal('${currentBook.id}', '${word}')" class="px-2 py-1.5 rounded-xl bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-200 text-[10px] font-extrabold" title="Usar em todos os livros">🌍</button>
                            ` : ''}
                            <button type="button" onclick="removeWordFromBook('${word}')" class="text-gray-400 hover:text-red-500 font-bold px-1.5 text-base">×</button>
                        </div>
                    `;
                    wordsList.appendChild(row);
                });
            }
        }

        window.deleteBook = function(bookId) {
            if (!booksLibrary[bookId] || !confirm(`Excluir o livro "${booksLibrary[bookId].title}"?`)) return;
            delete booksLibrary[bookId];
            if (activeBookId === bookId) activeBookId = '';
            saveAllStorage();
            renderBookManagerUI();
        };

        window.removeWordFromBook = function(word) {
            if (!activeBookId || !booksLibrary[activeBookId]) return;
            const b = booksLibrary[activeBookId];
            b.plannedWords = (b.plannedWords || []).filter(w => w !== word);
            if (b.sounds?.[word]) delete b.sounds[word];
            saveAllStorage();
            renderBookManagerUI();
            renderCustomSoundsUI();
        };

        function addWordsToActiveBook(wordsArray) {
            if (!activeBookId && !createOrUpdateBookFromInput()) return;
            const b = booksLibrary[activeBookId];
            if (!b.plannedWords) b.plannedWords = [];
            let added = 0;
            wordsArray.forEach(raw => {
                const clean = raw.trim().toLowerCase().replace(/[.,!?;:'"()[\]{}]/g, '');
                if (clean.length >= 2 && !stopWords.has(clean) && !b.plannedWords.includes(clean)) {
                    b.plannedWords.push(clean);
                    added++;
                }
            });
            saveAllStorage();
            renderBookManagerUI();
            if (added > 0) document.getElementById('book-multiword-feedback').innerText = `✨ +${added} palavra(s)! Toque no círculo vermelho para gravar cada som.`;
        }

        document.getElementById('btn-add-manual-word').addEventListener('click', () => {
            const inp = document.getElementById('manual-book-word');
            if (!inp.value.trim()) return;
            addWordsToActiveBook(inp.value.split(/\s+/));
            inp.value = '';
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        document.getElementById('btn-speak-multiple-words').addEventListener('click', () => {
            if (!SpeechRecognition) return alert('Seu navegador não suporta reconhecimento de voz.');
            if (!activeBookId && !createOrUpdateBookFromInput()) return;

            if (isCapturingMultiWords && multiWordRecognition) {
                isCapturingMultiWords = false;
                try { multiWordRecognition.stop(); } catch(e) {}
                return;
            }

            multiWordRecognition = new SpeechRecognition();
            multiWordRecognition.lang = 'pt-BR';
            multiWordRecognition.continuous = true;
            multiWordRecognition.interimResults = false;

            multiWordRecognition.onstart = () => {
                isCapturingMultiWords = true;
                document.getElementById('multi-word-btn-text').innerText = 'Parar Ditado';
                document.getElementById('book-multiword-feedback').innerText = '🎙️ Fale as palavras do livro pausadamente...';
            };
            multiWordRecognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) addWordsToActiveBook(event.results[i][0].transcript.split(/\s+/));
                }
            };
            multiWordRecognition.onend = () => {
                isCapturingMultiWords = false;
                document.getElementById('multi-word-btn-text').innerText = 'Ditar Palavras';
            };
            multiWordRecognition.start();
        });

        window.recordForBookWord = async function(word) {
            if (!activeBookId || !booksLibrary[activeBookId]) return;
            if (isCapturingMultiWords && multiWordRecognition) {
                isCapturingMultiWords = false;
                try { multiWordRecognition.stop(); } catch(e) {}
            }
            if (inlineRecordingWord === word && isRecordingClip && mediaRecorder) {
                mediaRecorder.stop();
                return;
            }
            try {
                if (!recordingStream) recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                inlineRecordingWord = word;
                renderBookManagerUI();

                let options = { audioBitsPerSecond: 32000 };
                if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options.mimeType = 'audio/webm;codecs=opus';
                else if (MediaRecorder.isTypeSupported('audio/mp4')) options.mimeType = 'audio/mp4';

                mediaRecorder = new MediaRecorder(recordingStream, options);
                mediaRecorder.ondataavailable = (e) => { if (e.data?.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    isRecordingClip = false;
                    inlineRecordingWord = null;
                    clearTimeout(recTimer);
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        if (!booksLibrary[activeBookId].sounds) booksLibrary[activeBookId].sounds = {};
                        booksLibrary[activeBookId].sounds[word] = { audioSrc: reader.result, emoji: '🔊' };
                        soundMode = 'custom';
                        saveAllStorage();
                        renderBookManagerUI();
                        playSpecificSound(activeBookId, word);
                        document.getElementById('book-multiword-feedback').innerText = `✅ Som de "${word}" gravado!`;
                    };
                    reader.readAsDataURL(audioBlob);
                };
                mediaRecorder.start();
                isRecordingClip = true;
                document.getElementById('book-multiword-feedback').innerText = `🔴 Gravando "${word}" (4s)...`;
                recTimer = setTimeout(() => { if (mediaRecorder?.state === 'recording') mediaRecorder.stop(); }, MAX_REC_TIME_MS);
            } catch (err) {
                inlineRecordingWord = null;
                alert('Permita o acesso ao microfone para gravar!');
            }
        };

        document.getElementById('btn-confirm-book-and-read').addEventListener('click', () => {
            if (bookTitleInput.value.trim() && (!activeBookId || booksLibrary[activeBookId]?.title !== bookTitleInput.value.trim())) {
                createOrUpdateBookFromInput();
            }
            navigateTo('reader');
        });

        // =========================================================================
        // 8. ESTÚDIO DE GRAVAÇÃO RÁPIDA + ESCOLHA DE ESCOPO
        // =========================================================================
        const studioModal = document.getElementById('custom-sounds-studio');
        const btnRecord = document.getElementById('btn-record-sound');
        const recInnerCircle = document.getElementById('rec-inner-circle');
        const recProgressContainer = document.getElementById('rec-progress-container');
        const recProgressBar = document.getElementById('rec-progress-bar');
        const studioFeedback = document.getElementById('studio-feedback');
        const scopeChoiceModal = document.getElementById('scope-choice-modal');
        const scopeBookSelect = document.getElementById('scope-book-select');

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecordingClip = false;
        let recTimer = null;
        let recInterval = null;
        let recordingStream = null;
        let autoWordRecognition = null;
        let capturedSpokenWord = '';
        let pendingSoundData = null;
        const MAX_REC_TIME_MS = 4000;

        function setStudioFeedback(msg, isError = false) {
            studioFeedback.innerText = msg;
            studioFeedback.className = `text-xs font-bold mb-3 min-h-[1rem] ${isError ? 'text-red-500' : 'text-purple-600 dark:text-purple-400'}`;
        }

        function stopStudioMicStream() {
            if (recordingStream) {
                recordingStream.getTracks().forEach(t => t.stop());
                recordingStream = null;
            }
            if (autoWordRecognition) { try { autoWordRecognition.stop(); } catch(e) {} }
        }

        window.openStudioForWord = function(prefillWord) {
            if (isListening) { isListening = false; try { recognition.stop(); } catch(e) {} }
            if (prefillWord) document.getElementById('studio-word').value = prefillWord;
            renderCustomSoundsUI();
            studioModal.classList.remove('hidden');
            studioModal.classList.add('flex');
            setStudioFeedback(prefillWord ? `Grave o som para "${prefillWord}"!` : 'Toque no círculo vermelho para gravar (4s).');
        };

        document.getElementById('btn-open-studio').addEventListener('click', () => window.openStudioForWord(''));

        function closeStudioModal() {
            if (isRecordingClip && mediaRecorder) mediaRecorder.stop();
            stopStudioMicStream();
            studioModal.classList.add('hidden');
            studioModal.classList.remove('flex');
        }

        document.getElementById('btn-close-studio').addEventListener('click', closeStudioModal);
        document.getElementById('btn-finish-studio-and-read').addEventListener('click', () => {
            soundMode = 'custom';
            closeStudioModal();
            navigateTo('reader');
        });

        window.selectEmoji = (emoji) => { document.getElementById('studio-emoji').value = emoji; };

        document.getElementById('btn-dictate-word').addEventListener('click', () => {
            if (!SpeechRecognition) return alert('Seu navegador não suporta ditado por voz.');
            const dictateRec = new SpeechRecognition();
            dictateRec.lang = 'pt-BR';
            setStudioFeedback('🗣️ Fale a palavra-gatilho...');
            dictateRec.onresult = (e) => {
                const spoken = e.results[0][0].transcript.trim().toLowerCase().replace(/[.,!?;:'"]/g, '').split(/\s+/)[0];
                document.getElementById('studio-word').value = spoken;
                setStudioFeedback(`Palavra: "${spoken}". Toque para gravar!`);
            };
            dictateRec.start();
        });

        btnRecord.addEventListener('click', async () => {
            if (isRecordingClip) {
                if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
                return;
            }
            try {
                if (!recordingStream) recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                capturedSpokenWord = '';
                const typedWord = document.getElementById('studio-word').value.trim().toLowerCase();

                if (!typedWord && SpeechRecognition) {
                    try {
                        autoWordRecognition = new SpeechRecognition();
                        autoWordRecognition.lang = 'pt-BR';
                        autoWordRecognition.onresult = (ev) => {
                            const t = ev.results[0][0].transcript.trim().toLowerCase().replace(/[.,!?;:'"]/g, '');
                            if (t) capturedSpokenWord = t.split(/\s+/)[0];
                        };
                        autoWordRecognition.start();
                    } catch (e) {}
                }

                let options = { audioBitsPerSecond: 32000 };
                if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options.mimeType = 'audio/webm;codecs=opus';
                else if (MediaRecorder.isTypeSupported('audio/mp4')) options.mimeType = 'audio/mp4';

                mediaRecorder = new MediaRecorder(recordingStream, options);
                mediaRecorder.ondataavailable = (e) => { if (e.data?.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    isRecordingClip = false;
                    clearTimeout(recTimer);
                    clearInterval(recInterval);
                    if (autoWordRecognition) { try { autoWordRecognition.stop(); } catch(e) {} }

                    btnRecord.classList.remove('rec-active');
                    recInnerCircle.classList.replace('rounded-sm', 'rounded-full');
                    recInnerCircle.classList.remove('scale-75');
                    recProgressContainer.classList.add('hidden');

                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => askScopeAndSaveRecordedSound(reader.result);
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorder.start();
                isRecordingClip = true;
                btnRecord.classList.add('rec-active');
                recInnerCircle.classList.replace('rounded-full', 'rounded-sm');
                recInnerCircle.classList.add('scale-75');
                recProgressContainer.classList.remove('hidden');

                let elapsed = 0;
                recInterval = setInterval(() => {
                    elapsed += 100;
                    recProgressBar.style.width = `${Math.min(100, (elapsed / MAX_REC_TIME_MS) * 100)}%`;
                    setStudioFeedback(`🔴 Gravando (${Math.max(0, (MAX_REC_TIME_MS - elapsed) / 1000).toFixed(1)}s)...`);
                }, 100);

                recTimer = setTimeout(() => { if (mediaRecorder?.state === 'recording') mediaRecorder.stop(); }, MAX_REC_TIME_MS);
            } catch (err) {
                setStudioFeedback('Permita o microfone para gravar!', true);
            }
        });

        function askScopeAndSaveRecordedSound(base64Audio) {
            let word = document.getElementById('studio-word').value.trim().toLowerCase().replace(/[.,!?;:'"]/g, '') || capturedSpokenWord;
            const emoji = document.getElementById('studio-emoji').value.trim() || '🔊';

            if (!word) {
                const prompted = prompt('Qual palavra vai ativar este som?');
                if (!prompted?.trim()) return setStudioFeedback('Gravação descartada.', true);
                word = prompted.trim().toLowerCase().replace(/[.,!?;:'"]/g, '');
            }

            pendingSoundData = { word, emoji, base64Audio };
            const bookIds = Object.keys(booksLibrary);
            scopeBookSelect.innerHTML = '';
            bookIds.forEach(id => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.innerText = `📘 ${booksLibrary[id].title}`;
                if (id === activeBookId) opt.selected = true;
                scopeBookSelect.appendChild(opt);
            });
            const optNew = document.createElement('option');
            optNew.value = 'NEW_BOOK';
            optNew.innerText = '+ Criar novo livro...';
            scopeBookSelect.appendChild(optNew);

            document.getElementById('scope-modal-desc').innerHTML = `Palavra: <strong>"${word}" (${emoji})</strong>`;
            scopeChoiceModal.classList.remove('hidden');
            scopeChoiceModal.classList.add('flex');
        }

        document.getElementById('btn-save-scope-book').addEventListener('click', () => {
            if (!pendingSoundData) return;
            let targetBookId = scopeBookSelect.value;
            if (targetBookId === 'NEW_BOOK' || !booksLibrary[targetBookId]) {
                const newTitle = prompt('Nome do novo livro:');
                if (!newTitle?.trim()) return;
                targetBookId = 'book_' + Date.now();
                booksLibrary[targetBookId] = { id: targetBookId, title: newTitle.trim(), transcript: '', plannedWords: [pendingSoundData.word], sounds: {} };
                activeBookId = targetBookId;
            }
            if (!booksLibrary[targetBookId].sounds) booksLibrary[targetBookId].sounds = {};
            booksLibrary[targetBookId].sounds[pendingSoundData.word] = { audioSrc: pendingSoundData.base64Audio, emoji: pendingSoundData.emoji };
            saveAllStorage();
            document.getElementById('studio-word').value = '';
            soundMode = 'custom';
            updateModeButtonsUI();
            renderBookManagerUI();
            playSpecificSound(targetBookId, pendingSoundData.word);
            setStudioFeedback(`✅ Salvo no livro "${booksLibrary[targetBookId].title}"!`);
            pendingSoundData = null;
            scopeChoiceModal.classList.add('hidden');
            scopeChoiceModal.classList.remove('flex');
        });

        document.getElementById('btn-save-scope-global').addEventListener('click', () => {
            if (!pendingSoundData) return;
            const { word, emoji, base64Audio } = pendingSoundData;
            if (globalCustomSounds[word] && !confirm(`Sobrescrever o som global de "${word}"?`)) return;
            globalCustomSounds[word] = { audioSrc: base64Audio, emoji };
            saveAllStorage();
            document.getElementById('studio-word').value = '';
            soundMode = 'custom';
            updateModeButtonsUI();
            playSpecificSound('GLOBAL', word);
            setStudioFeedback(`✅ Salvo para todos os livros!`);
            pendingSoundData = null;
            scopeChoiceModal.classList.add('hidden');
            scopeChoiceModal.classList.remove('flex');
        });

        document.getElementById('btn-cancel-scope').addEventListener('click', () => {
            pendingSoundData = null;
            scopeChoiceModal.classList.add('hidden');
            scopeChoiceModal.classList.remove('flex');
        });

        document.getElementById('studio-file-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 1.5 * 1024 * 1024) return alert('Escolha um áudio menor que 1.5MB.');
            const wordInput = document.getElementById('studio-word');
            if (!wordInput.value.trim()) wordInput.value = file.name.replace(/\.[^/.]+$/, "").toLowerCase().replace(/[-_]/g, " ");
            const reader = new FileReader();
            reader.onload = (ev) => { askScopeAndSaveRecordedSound(ev.target.result); e.target.value = ''; };
            reader.readAsDataURL(file);
        });

        // =========================================================================
        // 9. LEITURA POR VOZ & NUVEM DE PALAVRAS
        // =========================================================================
        let recognition;
        let isListening = false;
        let wordCooldowns = {};
        let fullReadingTranscript = '';
        let pendingInterimText = '';

        const animaArea = document.getElementById('anima-area');
        const listeningIndicator = document.getElementById('listening-indicator');
        const wordcloudSection = document.getElementById('wordcloud-section');
        const btnClearTranscript = document.getElementById('btn-clear-transcript');

        const stopWords = new Set([
            'a', 'o', 'e', 'é', 'de', 'do', 'da', 'dos', 'das', 'em', 'no', 'na', 'nos', 'nas',
            'um', 'uma', 'uns', 'umas', 'por', 'para', 'pra', 'com', 'sem', 'que', 'se', 'não',
            'mais', 'mas', 'como', 'foi', 'ao', 'aos', 'ele', 'ela', 'eles', 'elas', 'eu', 'tu',
            'nós', 'você', 'vocês', 'meu', 'minha', 'seu', 'sua', 'era', 'foram', 'está', 'estava',
            'muito', 'quando', 'já', 'também', 'só', 'pelo', 'pela', 'até', 'isso', 'isto', 'esse',
            'essa', 'este', 'esta', 'depois', 'então', 'lá', 'aqui', 'ali', 'ou', 'ser', 'ter', 'tinha'
        ]);

        function generateWordCloud() {
            if (pendingInterimText.trim()) {
                fullReadingTranscript += ' ' + pendingInterimText.trim();
                document.getElementById('final-text').innerText = fullReadingTranscript.trim() + ' ';
                document.getElementById('interim-text').innerText = '';
                pendingInterimText = '';
            }
            if (activeBookId && booksLibrary[activeBookId]) booksLibrary[activeBookId].transcript = fullReadingTranscript.trim();
            else freeReadingTranscript = fullReadingTranscript.trim();
            saveAllStorage();

            const rawText = fullReadingTranscript.trim();
            if (!rawText) return wordcloudSection.classList.add('hidden');

            const cleanWords = rawText.toLowerCase().replace(/[.,!?;:'"()[\]{}]/g, '').split(/\s+/).filter(w => w.length >= 2 && !stopWords.has(w));
            if (cleanWords.length === 0) return;

            const freqMap = {};
            let maxCount = 1;
            cleanWords.forEach(w => { freqMap[w] = (freqMap[w] || 0) + 1; if (freqMap[w] > maxCount) maxCount = freqMap[w]; });

            const sortedWords = Object.keys(freqMap).sort((a, b) => freqMap[b] - freqMap[a]).slice(0, 30);
            const canvas = document.getElementById('wordcloud-canvas');
            canvas.innerHTML = '';

            document.getElementById('wordcloud-stats').innerText = `${rawText.split(/\s+/).filter(Boolean).length} palavras lidas`;
            const colors = ['text-purple-600 dark:text-purple-400', 'text-indigo-600 dark:text-indigo-400', 'text-pink-600 dark:text-pink-400', 'text-emerald-600 dark:text-emerald-400'];

            sortedWords.sort(() => Math.random() - 0.5).forEach((word, idx) => {
                const count = freqMap[word];
                const fontSizeRem = (0.85 + (maxCount > 1 ? (count - 1) / (maxCount - 1) : 0.5) * 1.1).toFixed(2);
                let soundKey = word;
                let resolved = resolveSoundWithHierarchy(soundKey);
                if (!resolved) {
                    if (soundKey === 'leões' || soundKey === 'leoes') soundKey = 'leão';
                    else if (soundKey.endsWith('s')) soundKey = soundKey.slice(0, -1);
                    resolved = resolveSoundWithHierarchy(soundKey);
                }
                const hasSound = Boolean(resolved);

                const wrapper = document.createElement('div');
                wrapper.className = `inline-flex items-center gap-1 px-2 py-0.5 rounded-xl ${hasSound ? 'bg-white dark:bg-slate-800 shadow-sm border border-purple-200 dark:border-slate-600' : ''}`;

                const wordBtn = document.createElement('button');
                wordBtn.type = 'button';
                wordBtn.style.fontSize = `${fontSizeRem}rem`;
                wordBtn.className = `font-extrabold ${colors[idx % colors.length]}`;
                wordBtn.innerText = `${hasSound ? resolved.emoji + ' ' : ''}${word}`;
                wordBtn.onclick = () => hasSound ? triggerEffect(soundKey) : window.openStudioForWord(word);

                wrapper.appendChild(wordBtn);
                canvas.appendChild(wrapper);
            });

            wordcloudSection.classList.remove('hidden');
            btnClearTranscript.classList.remove('hidden');
        }

        document.getElementById('btn-close-wordcloud').addEventListener('click', () => wordcloudSection.classList.add('hidden'));

        btnClearTranscript.addEventListener('click', () => {
            fullReadingTranscript = '';
            pendingInterimText = '';
            if (activeBookId && booksLibrary[activeBookId]) booksLibrary[activeBookId].transcript = '';
            else freeReadingTranscript = '';
            saveAllStorage();
            document.getElementById('final-text').innerText = '';
            document.getElementById('interim-text').innerText = '';
            wordcloudSection.classList.add('hidden');
            btnClearTranscript.classList.add('hidden');
        });

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'pt-BR';

            recognition.onstart = () => {
                isListening = true;
                stopStudioMicStream();
                requestWakeLock();
                const btn = document.getElementById('btn-mic');
                btn.classList.add('mic-active', 'bg-slate-800', 'dark:bg-slate-700');
                btn.classList.remove('bg-gradient-to-r', 'from-purple-600', 'to-indigo-600');
                document.getElementById('btn-text').innerText = 'Finalizar Leitura';
                document.getElementById('status').innerText = 'Ouvindo história... 🎙️';
                wordcloudSection.classList.add('hidden');
                listeningIndicator.classList.remove('opacity-0');
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    isListening = false;
                    alert('Permita o acesso ao microfone no navegador!');
                }
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    releaseWakeLock();
                    const btn = document.getElementById('btn-mic');
                    btn.classList.remove('mic-active', 'bg-slate-800', 'dark:bg-slate-700');
                    btn.classList.add('bg-gradient-to-r', 'from-purple-600', 'to-indigo-600');
                    document.getElementById('btn-text').innerText = 'Iniciar Leitura';
                    document.getElementById('status').innerText = 'Leitura concluída ✨';
                    listeningIndicator.classList.add('opacity-0');
                    generateWordCloud();
                }
            };

            recognition.onresult = (event) => {
                let interimText = '';
                let finalSentence = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const wordText = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalSentence += wordText + ' ';
                        fullReadingTranscript += wordText + ' ';
                        document.getElementById('final-text').innerText = fullReadingTranscript;
                        if (activeBookId && booksLibrary[activeBookId]) booksLibrary[activeBookId].transcript = fullReadingTranscript.trim();
                        else freeReadingTranscript = fullReadingTranscript.trim();
                        saveAllStorage();
                    } else {
                        interimText += wordText;
                    }
                }
                pendingInterimText = interimText;
                document.getElementById('interim-text').innerText = interimText;
                btnClearTranscript.classList.remove('hidden');

                const textToAnalyze = (interimText + ' ' + finalSentence).trim();
                if (textToAnalyze.length > 0) {
                    processWords(textToAnalyze);
                    const container = document.getElementById('transcript-container');
                    container.scrollTop = container.scrollHeight;
                }
            };
        }

        function processWords(sentence) {
            const words = sentence.toLowerCase().replace(/[.,!?;:'"]/g, '').split(/\s+/);
            const now = Date.now();
            words.forEach(word => {
                if (!word) return;
                let targetWord = word;
                let resolvedItem = resolveSoundWithHierarchy(targetWord);
                if (!resolvedItem) {
                    if (targetWord === 'leões' || targetWord === 'leoes') targetWord = 'leão';
                    else if (targetWord.endsWith('s')) targetWord = targetWord.slice(0, -1);
                    resolvedItem = resolveSoundWithHierarchy(targetWord);
                }
                if (resolvedItem && (!wordCooldowns[targetWord] || now - wordCooldowns[targetWord] > 2500)) {
                    wordCooldowns[targetWord] = now;
                    playSoundAndAnimate(targetWord, resolvedItem);
                }
            });
        }

        window.triggerEffect = function(word) {
            unlockMobileAudio();
            const resolved = resolveSoundWithHierarchy(word)
                || (activeBookId && booksLibrary[activeBookId]?.sounds?.[word])
                || globalCustomSounds[word]
                || baseLibrary[word];
            if (resolved) playSoundAndAnimate(word, resolved);
        };

        function showAudioFeedback(msg) {
            const fb = document.getElementById('audio-feedback');
            fb.innerText = msg;
            fb.classList.remove('opacity-0');
            clearTimeout(fb.hideTimer);
            fb.hideTimer = setTimeout(() => fb.classList.add('opacity-0'), 2500);
        }

        function playSoundWithFallback(src, word, originLabel) {
            if (src.startsWith('data:')) {
                globalAudio.onerror = null;
                globalAudio.onplaying = () => showAudioFeedback(`🔊 ${originLabel}: ${word}`);
                globalAudio.src = src;
                globalAudio.play().catch(() => {});
                return;
            }
            const baseName = src.replace(/\.(mp3|wav|WAV)$/i, '');
            const fileNameOnly = baseName.split('/').pop();
            const capitalized = fileNameOnly.charAt(0).toUpperCase() + fileNameOnly.slice(1);
            const candidates = [...new Set([src, `${baseName}.wav`, `${baseName}.mp3`, `${baseName}.WAV`, `./audios/${capitalized}.mp3`, `./audios/${capitalized}.wav`, `./audios/${capitalized}.WAV`])];
            let idx = 0;

            function tryNext() {
                if (idx >= candidates.length) return showAudioFeedback(`⚠️ Áudio de "${word}" não encontrado`);
                const current = encodeURI(candidates[idx++]);
                globalAudio.onerror = () => tryNext();
                globalAudio.onplaying = () => showAudioFeedback(`🔊 ${originLabel}: ${word}`);
                globalAudio.src = current;
                globalAudio.load();
                globalAudio.play().catch(() => { if (globalAudio.error) tryNext(); });
            }
            tryNext();
        }

        function playSoundAndAnimate(word, item) {
            playSoundWithFallback(item.audioSrc, word, item.origin || 'Som');
            if (navigator.vibrate) navigator.vibrate(50);

            const emojiEl = document.getElementById('emoji-display');
            emojiEl.innerText = item.emoji;
            gsap.killTweensOf(emojiEl);
            gsap.fromTo(emojiEl, { opacity: 0, scale: 0, y: 50, rotation: Math.random() * 50 - 25 }, { opacity: 1, scale: 2.3, y: -15, rotation: 0, duration: 0.65, ease: "elastic.out(1, 0.5)" });
            gsap.to(emojiEl, { opacity: 0, scale: 0.8, y: -55, duration: 0.4, delay: 2.4, ease: "power2.in" });
        }

        document.getElementById('btn-mic').addEventListener('click', () => {
            if (isListening) {
                isListening = false;
                recognition.stop();
            } else {
                unlockMobileAudio();
                try { recognition.start(); } catch(e) {}
            }
        });

        // =========================================================================
        // 10. TOUR GUIADO INTERATIVO COM DESTAQUE (SPOTLIGHT)
        // =========================================================================
        const tourOverlay = document.getElementById('tour-overlay');
        const tourSpotlight = document.getElementById('tour-spotlight');
        const tourTooltip = document.getElementById('tour-tooltip');

        const tourSteps = [
            {
                view: 'home',
                target: '#btn-home-read-any',
                title: '📖 Ler um livro qualquer',
                desc: 'Quer começar rápido? Toque aqui para abrir o palco mágico e ler qualquer história em voz alta sem precisar cadastrar nada.'
            },
            {
                view: 'home',
                target: '#btn-home-register-book',
                title: '✨ Cadastrar um livro',
                desc: 'Crie livros personalizados com efeitos sonoros exclusivos feitos com a sua voz ou da criança (rugidos, risadas, trovões!).'
            },
            {
                view: 'reader',
                target: '#anima-area',
                title: '🎭 Palco Mágico Interativo',
                desc: 'Conforme você lê a história, o aplicativo reconhece palavras-chave (como leão, chuva, magia) e dispara animações e sons na hora.'
            },
            {
                view: 'reader',
                target: '#reader-sound-toggle',
                title: '🎵 Sons do App vs 🎧 Meus Sons',
                desc: 'Alterne entre os sons prontos do app ou os seus sons gravados. A prioridade é: 1º Som do Livro → 2º Som Global → 3º Som do App.'
            },
            {
                view: 'reader',
                target: '#btn-mic',
                title: '🎙️ Iniciar e Finalizar Leitura',
                desc: 'Toque aqui para ativar o microfone durante a leitura. Ao finalizar, o app gera automaticamente uma Nuvem de Palavras interativa!'
            },
            {
                view: 'books',
                target: '#book-editor-card',
                title: '🗣️ Dite Várias Palavras de Uma Vez',
                desc: 'Ao cadastrar um livro, dê um nome a ele e toque em "Ditar Palavras" para falar todos os gatilhos da história e gravar o som de cada um.'
            },
            {
                view: 'books',
                target: '#btn-open-studio',
                title: '💾 Sons Globais e Lembranças',
                desc: 'Aqui você grava sons rápidos para usar em todos os livros e pode baixar um arquivo .ZIP com todas as gravações para guardar de lembrança!'
            }
        ];

        let currentTourIndex = 0;

        function positionTourSpotlight() {
            const step = tourSteps[currentTourIndex];
            const targetEl = document.querySelector(step.target);
            if (!targetEl) return;

            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

            setTimeout(() => {
                const rect = targetEl.getBoundingClientRect();
                const pad = 8;

                tourSpotlight.style.top = `${rect.top - pad}px`;
                tourSpotlight.style.left = `${rect.left - pad}px`;
                tourSpotlight.style.width = `${rect.width + pad * 2}px`;
                tourSpotlight.style.height = `${rect.height + pad * 2}px`;

                // Posiciona o balão explicativo abaixo ou acima do elemento destacado
                const tooltipHeight = 200;
                const spaceBelow = window.innerHeight - rect.bottom;
                tourTooltip.style.left = '50%';
                tourTooltip.style.transform = 'translateX(-50%)';

                if (spaceBelow > tooltipHeight + 24) {
                    tourTooltip.style.top = `${rect.bottom + pad + 14}px`;
                    tourTooltip.style.bottom = 'auto';
                } else {
                    tourTooltip.style.top = 'auto';
                    tourTooltip.style.bottom = `${window.innerHeight - rect.top + pad + 14}px`;
                }
            }, 120);
        }

        function renderTourStep() {
            const step = tourSteps[currentTourIndex];
            if (currentView !== step.view) {
                navigateTo(step.view);
            }

            document.getElementById('tour-step-badge').innerText = `Passo ${currentTourIndex + 1} de ${tourSteps.length}`;
            document.getElementById('tour-title').innerText = step.title;
            document.getElementById('tour-desc').innerText = step.desc;

            const btnPrev = document.getElementById('btn-tour-prev');
            const btnNext = document.getElementById('btn-tour-next');

            btnPrev.style.visibility = currentTourIndex === 0 ? 'hidden' : 'visible';
            btnNext.innerText = currentTourIndex === tourSteps.length - 1 ? 'Concluir Tour ✨' : 'Próximo →';

            positionTourSpotlight();
        }

        function startTour() {
            currentTourIndex = 0;
            tourOverlay.classList.remove('hidden');
            renderTourStep();
        }

        function endTour() {
            tourOverlay.classList.add('hidden');
            navigateTo('home');
        }

        document.getElementById('btn-home-tour').addEventListener('click', startTour);
        document.getElementById('btn-tour-skip').addEventListener('click', endTour);

        document.getElementById('btn-tour-prev').addEventListener('click', () => {
            if (currentTourIndex > 0) {
                currentTourIndex--;
                renderTourStep();
            }
        });

        document.getElementById('btn-tour-next').addEventListener('click', () => {
            if (currentTourIndex < tourSteps.length - 1) {
                currentTourIndex++;
                renderTourStep();
            } else {
                endTour();
            }
        });

        window.addEventListener('resize', () => {
            if (!tourOverlay.classList.contains('hidden')) positionTourSpotlight();
        });

        // Inicialização
        updateHomeSummary();
    </script>
</body>
