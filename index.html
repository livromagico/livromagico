<!DOCTYPE html>
<html lang="pt-BR" class="transition-colors duration-700">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#8b5cf6">
    <title>Livro Mágico - Contos Interativos</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    
    <!-- GSAP para animações modernas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        body {
            background-size: 300% 300%;
            animation: gradientShift 20s ease infinite;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        
        .bg-light-mode { background-image: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
        .bg-dark-mode { background-image: linear-gradient(135deg, #0f172a 0%, #2e1065 100%); }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .mic-active {
            box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7);
            animation: pulse-purple 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        @keyframes pulse-purple {
            to { box-shadow: 0 0 0 25px rgba(139, 92, 246, 0); }
        }

        .audio-bar {
            width: 4px;
            background-color: #ef4444;
            border-radius: 4px;
            animation: bounceBar 1s infinite ease-in-out alternate;
        }
        .audio-bar:nth-child(2) { animation-delay: 0.2s; }
        .audio-bar:nth-child(3) { animation-delay: 0.4s; }
        .audio-bar:nth-child(4) { animation-delay: 0.1s; }
        
        @keyframes bounceBar {
            0% { height: 4px; }
            100% { height: 20px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-light-mode flex flex-col items-center justify-center p-4 md:p-6 font-sans text-gray-800 transition-colors duration-700">

    <div class="glass-panel p-6 md:p-10 rounded-[2.5rem] max-w-2xl w-full text-center relative overflow-hidden app-container opacity-0 translate-y-8">
        
        <!-- Cabeçalho de Navegação -->
        <div class="flex justify-between items-center mb-8">
            <button id="btn-settings" class="w-12 h-12 flex items-center justify-center rounded-full bg-white/50 dark:bg-slate-800/50 hover:bg-white dark:hover:bg-slate-700 text-purple-600 dark:text-purple-400 hover:scale-105 transition-all shadow-sm" title="Adicionar Som">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            </button>
            
            <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-500 dark:from-purple-400 dark:to-indigo-300 tracking-tight">Livro Mágico ✨</h1>
            
            <button id="btn-theme" class="w-12 h-12 flex items-center justify-center rounded-full bg-white/50 dark:bg-slate-800/50 hover:bg-white dark:hover:bg-slate-700 text-amber-500 hover:scale-105 transition-all shadow-sm" title="Modo Noturno">
                <svg id="icon-moon" class="w-6 h-6 block dark:hidden text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <svg id="icon-sun" class="w-6 h-6 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
            </button>
        </div>

        <!-- Painel de Adicionar Palavra -->
        <div id="add-word-panel" class="hidden absolute inset-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl z-20 p-8 flex-col justify-center items-center rounded-[2.5rem] transition-all">
            <h2 class="text-3xl font-bold text-purple-600 dark:text-purple-400 mb-8">Novo Encanto 🪄</h2>
            <input type="text" id="new-word" placeholder="Qual palavra? (ex: dinossauro)" class="w-full mb-4 p-4 rounded-2xl border border-purple-200 dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-400 shadow-inner text-lg">
            <input type="text" id="new-emoji" placeholder="Cole o Emoji aqui (ex: 🦖)" class="w-full mb-6 p-4 rounded-2xl border border-purple-200 dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white text-3xl text-center focus:outline-none focus:ring-2 focus:ring-purple-400 shadow-inner">
            <div class="w-full mb-8 text-left">
                <label class="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-3">Selecione o som (.mp3 ou .wav)</label>
                <input type="file" id="new-audio" accept="audio/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200 dark:file:bg-slate-700 dark:file:text-purple-300 cursor-pointer transition-colors">
            </div>
            <div class="flex gap-4 w-full">
                <button id="btn-cancel-add" class="flex-1 bg-gray-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-gray-800 dark:text-gray-200 py-4 rounded-full font-bold transition-all">Cancelar</button>
                <button id="btn-save-word" class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-500 hover:from-purple-700 hover:to-indigo-600 text-white py-4 rounded-full font-bold shadow-lg shadow-purple-500/40 transition-all">Salvar</button>
            </div>
        </div>

        <p class="text-gray-600 dark:text-gray-300 mb-6 font-medium text-lg" id="subtitle">A mágica acontece quando você lê em voz alta!</p>

        <!-- Palco do Emoji -->
        <div id="anima-area" class="h-56 md:h-64 flex items-center justify-center mb-6 bg-white/40 dark:bg-slate-800/40 rounded-3xl border border-white/50 dark:border-slate-600/50 overflow-hidden relative shadow-inner transition-all duration-700 ease-in-out">
            <span id="emoji-display" class="text-8xl md:text-9xl opacity-0 transform scale-50 drop-shadow-xl select-none">✨</span>
            
            <!-- Feedback de Status do Som no Palco -->
            <div id="audio-feedback" class="absolute top-3 left-4 text-xs font-semibold text-purple-600 dark:text-purple-300 opacity-0 transition-opacity duration-300"></div>

            <!-- Indicador de Ouvindo Moderno -->
            <div id="listening-indicator" class="absolute bottom-4 right-4 flex items-end gap-1 opacity-0 transition-opacity duration-500 h-6">
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
            </div>
        </div>
        
        <!-- ELEMENTOS DE LEITURA (Ocultos no modo imersivo) -->
        <div id="immersive-elements" class="transition-all duration-500 overflow-hidden">
            <!-- Botões rápidos de teste de som -->
            <div class="mb-4 flex flex-wrap items-center justify-center gap-2 text-xs">
                <span class="text-gray-500 dark:text-gray-400 font-medium">Testar som:</span>
                <button onclick="triggerEffect('leão')" class="px-3 py-1.5 rounded-full bg-white/70 dark:bg-slate-800/70 hover:bg-purple-100 dark:hover:bg-slate-700 text-gray-700 dark:text-gray-200 font-semibold shadow-sm transition-all">🦁 Leão</button>
                <button onclick="triggerEffect('macaco')" class="px-3 py-1.5 rounded-full bg-white/70 dark:bg-slate-800/70 hover:bg-purple-100 dark:hover:bg-slate-700 text-gray-700 dark:text-gray-200 font-semibold shadow-sm transition-all">🐵 Macaco</button>
                <button onclick="triggerEffect('gato')" class="px-3 py-1.5 rounded-full bg-white/70 dark:bg-slate-800/70 hover:bg-purple-100 dark:hover:bg-slate-700 text-gray-700 dark:text-gray-200 font-semibold shadow-sm transition-all">🐱 Gato</button>
                <button onclick="triggerEffect('galinha')" class="px-3 py-1.5 rounded-full bg-white/70 dark:bg-slate-800/70 hover:bg-purple-100 dark:hover:bg-slate-700 text-gray-700 dark:text-gray-200 font-semibold shadow-sm transition-all">🐔 Galinha</button>
                <button onclick="triggerEffect('pato')" class="px-3 py-1.5 rounded-full bg-white/70 dark:bg-slate-800/70 hover:bg-purple-100 dark:hover:bg-slate-700 text-gray-700 dark:text-gray-200 font-semibold shadow-sm transition-all">🦆 Pato</button>
            </div>

            <!-- Log de Transcrição Ao Vivo -->
            <div class="mb-6 text-left relative">
                <h3 class="font-bold text-gray-700 dark:text-gray-300 mb-2 text-sm uppercase tracking-wider flex justify-between">
                    <span>Lendo agora:</span>
                    <span id="status" class="text-xs font-medium text-purple-600 dark:text-purple-400">Pronto para começar</span>
                </h3>
                <div id="transcript-container" class="w-full h-28 p-4 bg-white/60 dark:bg-slate-800/60 rounded-2xl text-base md:text-lg text-gray-700 dark:text-gray-200 overflow-y-auto italic border border-white/40 dark:border-slate-600 shadow-inner leading-relaxed">
                    <span id="final-text"></span>
                    <span id="interim-text" class="text-purple-600 dark:text-purple-400 font-semibold"></span>
                </div>
            </div>
        </div>

        <!-- Botão Principal -->
        <button id="btn-mic" class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-5 px-10 rounded-full text-xl transition-all shadow-xl shadow-purple-500/30 flex items-center justify-center mx-auto gap-4 mt-2 w-full md:w-auto z-10 relative group hover:scale-105">
            <svg class="w-7 h-7 group-hover:animate-bounce" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd"></path></svg>
            <span id="btn-text">Abrir Livro Mágico</span>
        </button>

    </div>

    <script>
        gsap.to(".app-container", { opacity: 1, y: 0, duration: 1, ease: "power3.out" });

        // 1. Dark Mode
        const btnTheme = document.getElementById('btn-theme');
        const body = document.body;

        btnTheme.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            body.classList.toggle('bg-dark-mode');
            body.classList.toggle('bg-light-mode');
        });

        // 2. Wake Lock API (Evitar que a tela desligue)
        let wakeLock = null;
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } 
                catch (err) { console.log(err.message); }
            }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
        }

        // 3. REPRODUTOR DE ÁUDIO ÚNICO E CONTEXTO WEB AUDIO (Destrava o iOS/Safari)
        const globalAudio = new Audio();
        globalAudio.playsInline = true;
        let audioCtx = null;

        function unlockMobileAudio() {
            // Destrava o Web Audio API
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
                if (!audioCtx) audioCtx = new AudioContextClass();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }
            // Configura sessão de áudio no iOS 17+ para tocar alto mesmo usando microfone
            if (navigator.audioSession) {
                try { navigator.audioSession.type = 'play-and-record'; } catch(e) {}
            }
            // Destrava a instância única do HTMLAudioElement
            globalAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            globalAudio.volume = 1.0;
            globalAudio.play().catch(() => {});
        }

        // 4. Biblioteca de Sons (Mapeada exatamente com os arquivos do seu print no GitHub!)
        const baseLibrary = {
            // Arquivos presentes no seu print da pasta /audios:
            'leão': { audioSrc: './audios/Leão.WAV', emoji: '🦁' },
            'leao': { audioSrc: './audios/Leão.WAV', emoji: '🦁' },
            'macaco': { audioSrc: './audios/macaco.mp3', emoji: '🐵' },
            'cabra': { audioSrc: './audios/cabra.wav', emoji: '🐐' },
            'bode': { audioSrc: './audios/cabra.wav', emoji: '🐐' },
            'galinha': { audioSrc: './audios/galinha.wav', emoji: '🐔' },
            'gato': { audioSrc: './audios/gato.wav', emoji: '🐱' },
            'pato': { audioSrc: './audios/pato.wav', emoji: '🦆' },
            'galo': { audioSrc: './audios/rooster-crow.wav', emoji: '🐓' },
            'planta': { audioSrc: './audios/crop-wither.wav', emoji: '🌿' },
            'mato': { audioSrc: './audios/weed-pull.wav', emoji: '🌱' },
            'quebrou': { audioSrc: './audios/tool-break.wav', emoji: '💥' },

            // Outros gatilhos (caso você suba depois em .mp3 ou .wav):
            'cachorro': { audioSrc: './audios/cachorro.mp3', emoji: '🐶' },
            'cavalo': { audioSrc: './audios/cavalo.mp3', emoji: '🐴' },
            'passarinho': { audioSrc: './audios/passarinho.mp3', emoji: '🐦' },
            'chuva': { audioSrc: './audios/chuva.mp3', emoji: '🌧️' },
            'vento': { audioSrc: './audios/vento.mp3', emoji: '💨' },
            'trovão': { audioSrc: './audios/trovao.mp3', emoji: '⚡' },
            'trovao': { audioSrc: './audios/trovao.mp3', emoji: '⚡' },
            'água': { audioSrc: './audios/agua.mp3', emoji: '💧' },
            'agua': { audioSrc: './audios/agua.mp3', emoji: '💧' },
            'fogo': { audioSrc: './audios/fogo.mp3', emoji: '🔥' },
            'risada': { audioSrc: './audios/risada.mp3', emoji: '😂' },
            'choro': { audioSrc: './audios/choro.mp3', emoji: '😭' },
            'magia': { audioSrc: './audios/magia.mp3', emoji: '🪄' },
            'pulo': { audioSrc: './audios/pulo.mp3', emoji: '🦘' },
            'carro': { audioSrc: './audios/carro.mp3', emoji: '🚗' },
            'buzina': { audioSrc: './audios/buzina.mp3', emoji: '📯' },
            'avião': { audioSrc: './audios/aviao.mp3', emoji: '✈️' },
            'aviao': { audioSrc: './audios/aviao.mp3', emoji: '✈️' }
        };

        let customLibrary = JSON.parse(localStorage.getItem('livroMagicoCustomWords')) || {};

        // 5. Painel de Adicionar Palavra Customizada
        const addPanel = document.getElementById('add-word-panel');
        document.getElementById('btn-settings').addEventListener('click', () => {
            addPanel.classList.remove('hidden'); addPanel.classList.add('flex');
            gsap.fromTo(addPanel, {opacity: 0, scale: 0.9}, {opacity: 1, scale: 1, duration: 0.3});
        });

        document.getElementById('btn-cancel-add').addEventListener('click', () => {
            gsap.to(addPanel, {opacity: 0, scale: 0.9, duration: 0.2, onComplete: () => {
                addPanel.classList.add('hidden'); addPanel.classList.remove('flex');
            }});
        });

        document.getElementById('btn-save-word').addEventListener('click', () => {
            const word = document.getElementById('new-word').value.trim().toLowerCase();
            const emoji = document.getElementById('new-emoji').value.trim();
            const fileInput = document.getElementById('new-audio');

            if(!word || !emoji || fileInput.files.length === 0) return alert("Preencha todos os campos!");
            if(fileInput.files[0].size > 2 * 1024 * 1024) return alert("Áudio deve ser menor que 2MB.");

            const reader = new FileReader();
            reader.onload = function(e) {
                customLibrary[word] = { audioSrc: e.target.result, emoji: emoji };
                localStorage.setItem('livroMagicoCustomWords', JSON.stringify(customLibrary));
                alert(`Encanto salvo: "${word}" 🪄`);
                document.getElementById('new-word').value = '';
                document.getElementById('new-emoji').value = '';
                fileInput.value = '';
                document.getElementById('btn-cancel-add').click();
            };
            reader.readAsDataURL(fileInput.files[0]);
        });

        // 6. Configuração da Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isListening = false;
        let wordCooldowns = {}; // Evita que a mesma palavra toque repetidamente na mesma frase

        const immersiveEls = document.getElementById('immersive-elements');
        const animaArea = document.getElementById('anima-area');
        const listeningIndicator = document.getElementById('listening-indicator');

        function toggleImmersiveMode(active) {
            if (active) {
                immersiveEls.style.height = '0px'; immersiveEls.style.opacity = '0';
                animaArea.classList.replace('h-56', 'h-72'); animaArea.classList.add('md:h-96');
                listeningIndicator.classList.remove('opacity-0');
            } else {
                immersiveEls.style.height = immersiveEls.scrollHeight + 'px'; immersiveEls.style.opacity = '1';
                setTimeout(() => { immersiveEls.style.height = 'auto'; }, 500);
                animaArea.classList.replace('h-72', 'h-56'); animaArea.classList.remove('md:h-96');
                listeningIndicator.classList.add('opacity-0');
            }
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true; 
            recognition.interimResults = true; 
            recognition.lang = 'pt-BR'; 

            recognition.onstart = () => {
                isListening = true;
                requestWakeLock(); 
                
                const btn = document.getElementById('btn-mic');
                btn.classList.add('mic-active', 'bg-slate-800', 'dark:bg-slate-700');
                btn.classList.remove('bg-gradient-to-r', 'from-purple-600', 'to-indigo-600', 'hover:scale-105');
                document.getElementById('btn-text').innerText = 'Pausar Leitura';
                document.getElementById('status').innerText = 'Ouvindo... 🎙️';
                
                toggleImmersiveMode(true);
            };

            recognition.onerror = (event) => {
                console.warn("Aviso no microfone:", event.error);
                if(event.error === 'not-allowed') {
                    isListening = false;
                    alert('Permita o acesso ao microfone no navegador para a mágica funcionar!');
                }
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    releaseWakeLock(); 
                    const btn = document.getElementById('btn-mic');
                    btn.classList.remove('mic-active', 'bg-slate-800', 'dark:bg-slate-700');
                    btn.classList.add('bg-gradient-to-r', 'from-purple-600', 'to-indigo-600', 'hover:scale-105');
                    document.getElementById('btn-text').innerText = 'Abrir Livro Mágico';
                    document.getElementById('status').innerText = 'Pausado';
                    toggleImmersiveMode(false);
                }
            };

            recognition.onresult = (event) => {
                let interimText = '';
                let finalSentence = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const wordText = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalSentence += wordText + ' ';
                        document.getElementById('final-text').innerText += wordText + ' ';
                    } else {
                        interimText += wordText;
                    }
                }
                
                document.getElementById('interim-text').innerText = interimText;

                // Dispara imediatamente tanto nas palavras ao vivo quanto nas finais!
                const textToAnalyze = (interimText + ' ' + finalSentence).trim();
                if (textToAnalyze.length > 0) {
                    processWords(textToAnalyze);
                    const container = document.getElementById('transcript-container');
                    container.scrollTop = container.scrollHeight;
                }
            };

        } else {
            alert("Atenção: A digitação por voz não é suportada neste navegador. Tente no Safari (iOS) ou Chrome.");
        }

        // 7. Processamento de Palavras com Cooldown
        function processWords(sentence) {
            const words = sentence.toLowerCase().replace(/[.,!?;:'"]/g, '').split(/\s+/);
            const combinedLibrary = { ...baseLibrary, ...customLibrary };
            const now = Date.now();

            words.forEach(word => {
                if (!word) return;
                let targetWord = word;

                // Trata plural simples (ex: "macacos" -> "macaco", "leões" -> "leão")
                if (!combinedLibrary[targetWord]) {
                    if (targetWord === 'leões' || targetWord === 'leoes') targetWord = 'leão';
                    else if (targetWord.endsWith('s')) targetWord = targetWord.slice(0, -1);
                }

                if (combinedLibrary[targetWord]) {
                    // Cooldown de 2.5 segundos por palavra para não tocar repetido enquanto a frase ainda está sendo falada
                    if (!wordCooldowns[targetWord] || (now - wordCooldowns[targetWord] > 2500)) {
                        wordCooldowns[targetWord] = now;
                        playSoundAndAnimate(targetWord, combinedLibrary[targetWord]);
                    }
                }
            });
        }

        // Função para os botões de teste rápido
        window.triggerEffect = function(word) {
            unlockMobileAudio();
            const combinedLibrary = { ...baseLibrary, ...customLibrary };
            if (combinedLibrary[word]) {
                playSoundAndAnimate(word, combinedLibrary[word]);
            }
        };

        // 8. Reprodução com Fallback Automático de Extensão (.mp3 / .wav / .WAV)
        function showAudioFeedback(msg) {
            const fb = document.getElementById('audio-feedback');
            fb.innerText = msg;
            fb.classList.remove('opacity-0');
            clearTimeout(fb.hideTimer);
            fb.hideTimer = setTimeout(() => fb.classList.add('opacity-0'), 2500);
        }

        function playSoundWithFallback(src, word) {
            // Se for Base64 (upload do celular), toca direto
            if (src.startsWith('data:')) {
                globalAudio.src = src;
                globalAudio.play().catch(err => console.error(err));
                return;
            }

            // Lista de tentativas caso o nome no GitHub tenha extensão ou maiúscula diferente
            const baseName = src.replace(/\.(mp3|wav|WAV)$/i, '');
            const fileNameOnly = baseName.split('/').pop();
            const capitalized = fileNameOnly.charAt(0).toUpperCase() + fileNameOnly.slice(1);
            
            const candidates = [
                src,
                `${baseName}.wav`,
                `${baseName}.mp3`,
                `${baseName}.WAV`,
                `./audios/${capitalized}.mp3`,
                `./audios/${capitalized}.wav`,
                `./audios/${capitalized}.WAV`
            ];
            // Remove duplicados
            const uniqueCandidates = [...new Set(candidates)];
            let attemptIndex = 0;

            function tryNext() {
                if (attemptIndex >= uniqueCandidates.length) {
                    showAudioFeedback(`⚠️ Áudio de "${word}" não encontrado na pasta`);
                    return;
                }
                const currentCandidate = encodeURI(uniqueCandidates[attemptIndex]);
                attemptIndex++;

                globalAudio.onerror = () => {
                    tryNext(); // Se deu erro 404 no GitHub, tenta a próxima variação automaticamente
                };
                globalAudio.onplaying = () => {
                    showAudioFeedback(`🔊 Tocando: ${word}`);
                };

                globalAudio.src = currentCandidate;
                globalAudio.load();
                globalAudio.play().catch(() => {
                    // Se falhou por não encontrar ou bloqueio, tenta o próximo
                    if (globalAudio.error) tryNext();
                });
            }

            tryNext();
        }

        function playSoundAndAnimate(word, item) {
            playSoundWithFallback(item.audioSrc, word);

            if (navigator.vibrate) navigator.vibrate(50); 

            const emojiEl = document.getElementById('emoji-display');
            emojiEl.innerText = item.emoji;
            
            gsap.killTweensOf(emojiEl);
            
            gsap.fromTo(emojiEl, 
                { opacity: 0, scale: 0, y: 50, rotation: Math.random() * 60 - 30 }, 
                { opacity: 1, scale: 2.5, y: -20, rotation: 0, duration: 0.7, ease: "elastic.out(1, 0.5)" }
            );
            
            gsap.to(emojiEl, {
                opacity: 0, scale: 0.8, y: -60, duration: 0.4, delay: 2.5, ease: "power2.in"
            });
        }

        // 9. Controle do Botão Principal
        document.getElementById('btn-mic').addEventListener('click', () => {
            if (isListening) {
                isListening = false;
                recognition.stop();
            } else {
                unlockMobileAudio();
                try { recognition.start(); } catch(e) {}
            }
        });
    </script>
</body>
