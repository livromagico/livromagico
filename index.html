<!DOCTYPE html>
<html lang="pt-BR" class="transition-colors duration-700">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#8b5cf6">
    <title>Livro Mágico - Contos Interativos</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    
    <!-- GSAP & JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        body {
            background-size: 300% 300%;
            animation: gradientShift 20s ease infinite;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        
        .bg-light-mode { background-image: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
        .bg-dark-mode { background-image: linear-gradient(135deg, #0f172a 0%, #2e1065 100%); }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
        }

        .mic-active {
            box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7);
            animation: pulse-purple 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        @keyframes pulse-purple {
            to { box-shadow: 0 0 0 25px rgba(139, 92, 246, 0); }
        }

        .rec-active {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-red 1s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        @keyframes pulse-red {
            to { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
        }

        .audio-bar {
            width: 4px;
            background-color: #a855f7;
            border-radius: 4px;
            animation: bounceBar 1s infinite ease-in-out alternate;
        }
        .audio-bar:nth-child(2) { animation-delay: 0.2s; }
        .audio-bar:nth-child(3) { animation-delay: 0.4s; }
        .audio-bar:nth-child(4) { animation-delay: 0.1s; }
        
        @keyframes bounceBar {
            0% { height: 4px; }
            100% { height: 22px; }
        }

        /* Spotlight do Tour Guiado */
        #tour-spotlight {
            position: fixed;
            border-radius: 1.25rem;
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.78), 0 0 0 4px #a855f7;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 90;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-light-mode flex flex-col items-center justify-center p-4 md:p-6 font-sans text-gray-800 dark:text-gray-100 transition-colors duration-700">

    <div class="glass-panel p-6 md:p-9 rounded-[2.5rem] max-w-xl w-full text-center relative overflow-hidden app-container opacity-0 translate-y-6">
        
        <!-- CABEÇALHO MINIMALISTA -->
        <header class="flex justify-between items-center mb-6">
            <button id="btn-home" type="button" class="invisible w-11 h-11 flex items-center justify-center rounded-2xl bg-white/70 dark:bg-slate-800/70 hover:bg-white dark:hover:bg-slate-700 text-purple-600 dark:text-purple-300 shadow-sm transition-all active:scale-95" title="Voltar ao Início">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
            </button>

            <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-500 dark:from-purple-400 dark:to-indigo-300 tracking-tight select-none">
                Livro Mágico ✨
            </h1>

            <button id="btn-theme" type="button" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white/70 dark:bg-slate-800/70 hover:bg-white dark:hover:bg-slate-700 text-amber-500 shadow-sm transition-all active:scale-95" title="Alternar Tema">
                <svg id="icon-moon" class="w-5 h-5 block dark:hidden text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <svg id="icon-sun" class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
            </button>
        </header>

        <!-- ========================================================= -->
        <!-- VIEW 1: TELA INICIAL (APENAS 3 BOTÕES GRANDES E CLAROS)   -->
        <!-- ========================================================= -->
        <main id="view-home" class="flex flex-col gap-4 py-2">
            <!-- Botão 1: Ler um livro qualquer -->
            <button id="btn-home-read-any" type="button" class="group w-full p-6 rounded-3xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white shadow-xl shadow-purple-500/25 flex items-center gap-5 text-left transition-all hover:scale-[1.02] active:scale-[0.98]">
                <div class="w-16 h-16 rounded-2xl bg-white/20 flex items-center justify-center text-4xl shrink-0 group-hover:scale-110 transition-transform">
                    📖
                </div>
                <div>
                    <span class="block text-xl md:text-2xl font-extrabold tracking-tight">Ler um livro qualquer</span>
                    <span class="block text-xs md:text-sm text-purple-100 font-medium mt-0.5">Abrir o palco mágico e ler agora</span>
                </div>
            </button>

            <!-- Botão 2: Cadastrar um livro -->
            <button id="btn-home-register-book" type="button" class="group w-full p-6 rounded-3xl bg-white/85 dark:bg-slate-800/85 hover:bg-white dark:hover:bg-slate-800 border-2 border-purple-200 dark:border-slate-700 shadow-lg flex items-center gap-5 text-left transition-all hover:scale-[1.02] active:scale-[0.98]">
                <div class="w-16 h-16 rounded-2xl bg-purple-100 dark:bg-purple-950 flex items-center justify-center text-4xl shrink-0 group-hover:scale-110 transition-transform">
                    ✨
                </div>
                <div class="flex-1 min-w-0">
                    <span class="block text-xl md:text-2xl font-extrabold text-gray-800 dark:text-white tracking-tight">Cadastrar um livro</span>
                    <span id="home-books-summary" class="block text-xs md:text-sm text-gray-500 dark:text-gray-400 font-medium mt-0.5 truncate">Criar histórias e gravar sons próprios</span>
                </div>
            </button>

            <!-- Botão 3: Fazer um tour -->
            <button id="btn-home-tour" type="button" class="group w-full p-5 rounded-3xl bg-white/55 dark:bg-slate-800/50 hover:bg-white/80 dark:hover:bg-slate-800/80 border border-white/60 dark:border-slate-700 flex items-center gap-5 text-left transition-all hover:scale-[1.01] active:scale-[0.98]">
                <div class="w-14 h-14 rounded-2xl bg-amber-100 dark:bg-amber-950/60 flex items-center justify-center text-3xl shrink-0 group-hover:rotate-12 transition-transform">
                    🪄
                </div>
                <div>
                    <span class="block text-lg md:text-xl font-extrabold text-gray-700 dark:text-gray-200">Fazer um tour</span>
                    <span class="block text-xs text-gray-500 dark:text-gray-400 font-medium">Aprenda como funciona em 30 segundos</span>
                </div>
            </button>
        </main>

        <!-- ========================================================= -->
        <!-- VIEW 2: PALCO DE LEITURA (LIMPO E SEM POLUIÇÃO VISUAL)    -->
        <!-- ========================================================= -->
        <section id="view-reader" class="hidden flex-col">
            <!-- Barra Compacta de Contexto (Livro + Fonte de Som) -->
            <div id="reader-context-bar" class="flex items-center justify-between gap-2 p-2.5 mb-4 rounded-2xl bg-white/70 dark:bg-slate-800/70 border border-white/60 dark:border-slate-700 shadow-sm">
                <button id="btn-reader-pick-book" type="button" class="flex items-center gap-2 text-left min-w-0 flex-1 px-2 py-1 rounded-xl hover:bg-purple-50 dark:hover:bg-slate-700/60 transition-colors">
                    <span class="text-xl shrink-0">📚</span>
                    <div class="truncate">
                        <span id="reader-book-title" class="text-sm font-extrabold text-purple-700 dark:text-purple-300 truncate block">Leitura Livre</span>
                        <span class="text-[10px] text-gray-500 dark:text-gray-400 block">Toque para trocar de livro</span>
                    </div>
                </button>

                <!-- Alternador Limpo de Modo de Som -->
                <div id="reader-sound-toggle" class="flex items-center bg-gray-100 dark:bg-slate-900 p-1 rounded-xl shrink-0">
                    <button id="btn-mode-app" type="button" class="px-3 py-1.5 rounded-lg text-xs font-extrabold transition-all bg-purple-600 text-white shadow-sm">
                        🎵 App
                    </button>
                    <button id="btn-mode-custom" type="button" class="px-3 py-1.5 rounded-lg text-xs font-extrabold transition-all text-gray-600 dark:text-gray-300 flex items-center gap-1">
                        <span>🎧 Meus</span>
                        <span id="custom-count-badge" class="bg-purple-200 text-purple-800 dark:bg-purple-900 dark:text-purple-200 px-1.5 rounded-full text-[10px] hidden">0</span>
                    </button>
                </div>
            </div>

            <!-- Palco do Emoji -->
            <div id="anima-area" class="h-52 md:h-64 flex items-center justify-center mb-4 bg-white/50 dark:bg-slate-800/50 rounded-3xl border border-white/60 dark:border-slate-700 overflow-hidden relative shadow-inner transition-all duration-500">
                <span id="emoji-display" class="text-8xl md:text-9xl opacity-0 transform scale-50 drop-shadow-xl select-none">✨</span>
                
                <div id="audio-feedback" class="absolute top-3 left-4 text-xs font-bold text-purple-700 dark:text-purple-300 bg-white/80 dark:bg-slate-900/80 px-3 py-1 rounded-full opacity-0 transition-opacity duration-300"></div>

                <div id="listening-indicator" class="absolute bottom-4 right-4 flex items-end gap-1 opacity-0 transition-opacity duration-500 h-6">
                    <div class="audio-bar"></div>
                    <div class="audio-bar"></div>
                    <div class="audio-bar"></div>
                    <div class="audio-bar"></div>
                </div>
            </div>

            <!-- Botões Rápidos de Teste -->
            <div id="quick-test-bar" class="mb-4 flex flex-wrap items-center justify-center gap-1.5 text-xs"></div>

            <!-- Nuvem de Palavras (Aparece ao finalizar leitura ou abrir livro já lido) -->
            <div id="wordcloud-section" class="hidden mb-4 p-4 bg-white/85 dark:bg-slate-800/90 rounded-3xl border border-purple-200 dark:border-slate-700 shadow-md text-left">
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <h3 class="font-extrabold text-purple-700 dark:text-purple-300 text-xs md:text-sm">☁️ Palavras da História</h3>
                        <p id="wordcloud-stats" class="text-[11px] text-gray-500 dark:text-gray-400"></p>
                    </div>
                    <button id="btn-close-wordcloud" type="button" class="text-xs text-gray-400 hover:text-gray-600 font-bold px-2 py-1">Fechar ×</button>
                </div>
                <div id="wordcloud-canvas" class="flex flex-wrap items-center justify-center gap-2 py-3 px-2 min-h-[5rem] bg-purple-50/60 dark:bg-slate-900/60 rounded-2xl"></div>
            </div>

            <!-- Transcrição Compacta -->
            <div id="transcript-box" class="mb-5 text-left">
                <div class="flex justify-between items-center mb-1.5 px-1">
                    <span id="status" class="text-xs font-bold text-purple-600 dark:text-purple-400">Pronto para ouvir</span>
                    <button id="btn-clear-transcript" type="button" class="text-xs text-gray-400 hover:text-red-500 hidden">Limpar texto</button>
                </div>
                <div id="transcript-container" class="w-full h-20 p-3 bg-white/60 dark:bg-slate-800/60 rounded-2xl text-sm text-gray-700 dark:text-gray-200 overflow-y-auto italic border border-white/50 dark:border-slate-700 shadow-inner">
                    <span id="final-text"></span>
                    <span id="interim-text" class="text-purple-600 dark:text-purple-400 font-semibold"></span>
                </div>
            </div>

            <!-- Botão Gigante de Leitura -->
            <button id="btn-mic" type="button" class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-extrabold py-5 px-8 rounded-3xl text-lg md:text-xl transition-all shadow-xl shadow-purple-500/30 flex items-center justify-center gap-3 w-full hover:scale-[1.02] active:scale-[0.98]">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd"></path></svg>
                <span id="btn-text">Iniciar Leitura</span>
            </button>
        </section>

        <!-- ========================================================= -->
        <!-- VIEW 3: CADASTRAR LIVRO & MEUS SONS (ORGANIZADO EM ETAPAS)-->
        <!-- ========================================================= -->
        <section id="view-books" class="hidden flex-col text-left">
            <!-- Barra Superior de Ferramentas de Áudio -->
            <div class="flex items-center justify-between gap-2 mb-4">
                <span class="text-xs font-extrabold uppercase tracking-wider text-gray-500 dark:text-gray-400">Biblioteca & Sons</span>
                <div class="flex items-center gap-2">
                    <button id="btn-open-studio" type="button" class="px-3.5 py-2 rounded-xl bg-purple-100 dark:bg-slate-800 text-purple-700 dark:text-purple-300 font-extrabold text-xs hover:bg-purple-200 transition-all">
                        🎙️ Gravar Som Rápido
                    </button>
                    <button id="btn-download-all-sounds" type="button" class="px-3 py-2 rounded-xl bg-indigo-100 dark:bg-slate-800 text-indigo-700 dark:text-indigo-300 font-extrabold text-xs hover:bg-indigo-200 transition-all hidden" title="Baixar todos os sons gravados de lembrança">
                        💾 .ZIP
                    </button>
                </div>
            </div>

            <!-- Meus Livros Salvos + Opção de Leitura Livre -->
            <div class="mb-4">
                <div id="saved-books-list" class="flex flex-wrap gap-2 max-h-28 overflow-y-auto p-2.5 rounded-2xl bg-white/60 dark:bg-slate-800/60 border border-white/60 dark:border-slate-700"></div>
            </div>

            <!-- Cartão de Cadastro / Edição do Livro -->
            <div id="book-editor-card" class="bg-white/80 dark:bg-slate-800/80 p-4 md:p-5 rounded-3xl border border-purple-200 dark:border-slate-700 shadow-sm mb-4">
                <label class="block text-xs font-extrabold uppercase text-purple-700 dark:text-purple-300 mb-1.5">1. Nome do Livro</label>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="book-title-input" placeholder="Ex: Os Três Porquinhos" class="flex-1 p-3.5 rounded-2xl border border-purple-200 dark:border-slate-600 bg-white dark:bg-slate-900 dark:text-white text-sm font-bold focus:outline-none focus:ring-2 focus:ring-purple-400">
                    <button id="btn-save-book-title" type="button" class="px-5 py-3 rounded-2xl bg-purple-600 hover:bg-purple-700 text-white font-extrabold text-xs shadow-md transition-all">
                        Salvar
                    </button>
                </div>

                <label class="block text-xs font-extrabold uppercase text-purple-700 dark:text-purple-300 mb-1.5">2. Palavras Mágicas do Livro</label>
                <div class="flex flex-wrap gap-2 mb-3">
                    <button id="btn-speak-multiple-words" type="button" class="flex-1 py-3 px-4 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-extrabold text-xs shadow-md flex items-center justify-center gap-2 transition-all active:scale-95">
                        <span>🗣️</span>
                        <span id="multi-word-btn-text">Ditar Palavras</span>
                    </button>
                    <div class="flex gap-1.5 flex-1 min-w-[160px]">
                        <input type="text" id="manual-book-word" placeholder="Ou digite..." class="flex-1 p-3 rounded-2xl border border-purple-200 dark:border-slate-600 bg-white dark:bg-slate-900 dark:text-white text-xs font-semibold">
                        <button id="btn-add-manual-word" type="button" class="px-4 py-2 rounded-2xl bg-gray-200 dark:bg-slate-700 text-gray-800 dark:text-gray-200 font-extrabold text-xs">+</button>
                    </div>
                </div>

                <p id="book-multiword-feedback" class="text-xs font-bold text-purple-600 dark:text-purple-400 mb-2 min-h-[1rem]"></p>

                <!-- Lista de Palavras do Livro -->
                <div id="book-words-list" class="max-h-44 overflow-y-auto space-y-2 p-2.5 rounded-2xl bg-gray-50/80 dark:bg-slate-900/60 border border-purple-100 dark:border-slate-700 min-h-[4.5rem]"></div>
            </div>

            <!-- Botão Gigante para Ler o Livro Cadastrado -->
            <button id="btn-confirm-book-and-read" type="button" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-extrabold py-4 px-6 rounded-3xl shadow-lg shadow-emerald-500/25 text-base flex items-center justify-center gap-2 transition-all hover:scale-[1.01] active:scale-[0.98]">
                <span>📖 Ler este Livro Agora</span>
            </button>
        </section>

        <!-- ========================================================= -->
        <!-- MODAL: COMPLEMENTAR COM SONS DO APP?                      -->
        <!-- ========================================================= -->
        <div id="fallback-modal" class="hidden absolute inset-0 bg-slate-900/70 backdrop-blur-md z-40 p-6 flex-col justify-center items-center rounded-[2.5rem]">
            <div class="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-3xl max-w-md w-full shadow-2xl border border-purple-100 dark:border-slate-700 text-center">
                <div class="text-4xl mb-3">🎧 + 🎵</div>
                <h3 class="text-xl font-extrabold text-gray-800 dark:text-white mb-2">Completar com sons do app?</h3>
                <p class="text-sm text-gray-600 dark:text-gray-300 mb-6 leading-relaxed">
                    Se você ler uma palavra que ainda não gravou, deseja tocar os sons padrão do aplicativo?
                </p>
                <div class="flex flex-col gap-3">
                    <button id="btn-fallback-yes" type="button" class="w-full py-4 px-4 rounded-2xl font-extrabold text-white bg-gradient-to-r from-purple-600 to-indigo-600 shadow-lg transition-all">
                        Sim, usar meus sons + sons do app
                    </button>
                    <button id="btn-fallback-no" type="button" class="w-full py-4 px-4 rounded-2xl font-extrabold text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-slate-700 transition-all">
                        Não, tocar apenas o que eu gravei
                    </button>
                </div>
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- MODAL: ESCOLHER ESCOPO AO GRAVAR SOM (LIVRO X GLOBAL)     -->
        <!-- ========================================================= -->
        <div id="scope-choice-modal" class="hidden absolute inset-0 bg-slate-900/75 backdrop-blur-md z-50 p-6 flex-col justify-center items-center rounded-[2.5rem]">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl max-w-md w-full shadow-2xl border border-purple-200 dark:border-slate-700 text-center">
                <div class="text-4xl mb-2">🎯</div>
                <h3 class="text-xl font-extrabold text-gray-800 dark:text-white mb-1">Onde usar este som?</h3>
                <p id="scope-modal-desc" class="text-xs text-gray-500 dark:text-gray-300 mb-4"></p>

                <div class="bg-purple-50 dark:bg-slate-900/80 p-4 rounded-2xl border border-purple-200 dark:border-slate-700 mb-3 text-left">
                    <select id="scope-book-select" class="w-full p-3 rounded-xl border border-purple-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-gray-800 dark:text-white text-sm font-bold mb-2.5 focus:outline-none"></select>
                    <button id="btn-save-scope-book" type="button" class="w-full py-3.5 px-4 rounded-xl font-extrabold text-white bg-purple-600 hover:bg-purple-700 shadow-md text-xs md:text-sm">
                        📚 Salvar apenas neste Livro
                    </button>
                </div>

                <button id="btn-save-scope-global" type="button" class="w-full py-3.5 px-4 rounded-xl font-extrabold text-indigo-700 dark:text-indigo-200 bg-indigo-100 dark:bg-indigo-950/70 hover:bg-indigo-200 text-xs md:text-sm mb-2">
                    🌍 Usar em Todos os Livros
                </button>

                <button id="btn-cancel-scope" type="button" class="text-xs text-gray-400 hover:text-gray-600 mt-1 py-1">
                    Cancelar
                </button>
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- MODAL: ESTÚDIO DE GRAVAÇÃO RÁPIDA & SONS GLOBAIS          -->
        <!-- ========================================================= -->
        <div id="custom-sounds-studio" class="hidden absolute inset-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl z-30 p-6 flex-col justify-between items-center rounded-[2.5rem] overflow-y-auto">
            <div class="w-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-extrabold text-purple-600 dark:text-purple-400">🎙️ Gravar Som Rápido</h2>
                    <button id="btn-close-studio" type="button" class="px-3 py-1.5 rounded-xl bg-gray-100 dark:bg-slate-800 text-xs font-extrabold text-gray-600 dark:text-gray-300">Fechar ×</button>
                </div>

                <div class="bg-purple-50/80 dark:bg-slate-800/80 p-4 rounded-3xl border border-purple-100 dark:border-slate-700 mb-4">
                    <div class="flex gap-2 mb-3">
                        <div class="relative flex-1">

                ✅ Concluir e Ir para Leitura

    </div>

    <!-- ========================================================= -->
    <!-- OVERLAY DO TOUR GUIADO INTERATIVO (SPOTLIGHT)             -->
    <!-- ========================================================= -->
    <div id="tour-overlay" class="hidden fixed inset-0 z-[85] pointer-events-auto">
        <!-- Máscara de Recorte (Spotlight) -->
        <div id="tour-spotlight"></div>

        <!-- Cartão Explicativo Flutuante -->
        <div id="tour-tooltip" class="fixed z-[95] w-[90%] max-w-sm bg-white dark:bg-slate-800 p-5 rounded-3xl shadow-2xl border-2 border-purple-400 text-left transition-all duration-300">
            <div class="flex justify-between items-center mb-2">
                <span id="tour-step-badge" class="text-[11px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-purple-100 dark:bg-purple-900 text-purple-700 dark:text-purple-200">Passo 1 de 7</span>

                <button id="btn-tour-prev" type="button" class="px-4 py-2.5 rounded-xl bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-gray-200 font-bold text-xs">
                    ← Anterior
                </button>
                <button id="btn-tour-next" type="button" class="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-extrabold text-xs shadow-md">
                    Próximo →
                </button>
            </div>
        </div>
